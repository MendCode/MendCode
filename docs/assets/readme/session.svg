<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" style="white-space:pre"><text x="32.8" y="63" textLength="252.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">fix/coupon-cap ~/Code/shop-api</text><text x="511.6" y="63" textLength="352.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Cap coupon discounts at the coupon's limit</text><text x="1166.8" y="63" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e">+33</text><text x="1200.4" y="63" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#ef4444">-2</text><text x="1225.6" y="63" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">|</text><text x="1318.0" y="63" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">46%</text><text x="32.8" y="81" textLength="764.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">› Orders with a capped coupon get the full percentage off. Find why, fix it and add a test.</text><text x="58.0" y="117" textLength="193.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">◇ Read 3 files · Grep 1</text><text x="58.0" y="153" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#187d3e">✎</text><text x="74.8" y="153" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Edit</text><text x="116.8" y="153" textLength="151.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">src/cart/totals.ts</text><text x="284.8" y="153" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#22c55e">+2</text><text x="310.0" y="153" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#ef4444">−1</text><text x="58.0" y="171" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="171" textLength="520.8" lengthAdjust="spacingAndGlyphs" fill="#25789a">@@ -18,5 +18,6 @@ export function totals(cart: Cart): Totals {</text><text x="58.0" y="189" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="189" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">18 18</text><text x="158.8" y="189" textLength="394.8" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const subtotal = sum(cart.items.map(lineTotal))</text><text x="58.0" y="207" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="207" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">19</text><text x="125.2" y="207" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ef4444">-</text><text x="158.8" y="207" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const</text><text x="209.2" y="207" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#ef4444" font-weight="700">discount</text><text x="284.8" y="207" textLength="243.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">= subtotal * cart.coupon.rate</text><text x="58.0" y="225" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="100.0" y="225" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">19</text><text x="125.2" y="225" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">+</text><text x="158.8" y="225" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const</text><text x="209.2" y="225" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e" font-weight="700">raw</text><text x="242.8" y="225" textLength="243.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">= subtotal * cart.coupon.rate</text><text x="58.0" y="243" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="100.0" y="243" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">20</text><text x="125.2" y="243" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">+</text><text x="158.8" y="243" textLength="453.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const discount = Math.min(raw, cart.coupon.cap ?? raw)</text><text x="58.0" y="261" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="261" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">20 21</text><text x="158.8" y="261" textLength="378.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const total = roundCents(subtotal - discount)</text><text x="58.0" y="279" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="279" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">21 22</text><text x="158.8" y="279" textLength="302.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff">return { subtotal, discount, total }</text><text x="58.0" y="297" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="297" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">22 23</text><text x="142.0" y="297" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff">}</text><text x="58.0" y="333" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#187d3e">$</text><text x="74.8" y="333" textLength="235.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e" font-weight="700">bun test test/totals.test.ts</text><text x="326.8" y="333" textLength="126.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">3 pass · 0 fail</text><text x="58.0" y="369" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#187d3e">◈</text><text x="74.8" y="369" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Graph callers</text><text x="192.4" y="369" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">totals</text><text x="259.6" y="369" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">2 lines</text><text x="58.0" y="405" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#187d3e">◔</text><text x="74.8" y="405" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Task</text><text x="116.8" y="405" textLength="252.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">Check the API's coupon preview</text><text x="385.6" y="405" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e">reviewer</text><text x="461.2" y="405" textLength="226.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">· GPT-6-Luna-Mini · 4 calls</text><text x="1309.6" y="405" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">21.4s</text><text x="58.0" y="441" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">✓</text><text x="74.8" y="441" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">Todos</text><text x="125.2" y="441" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">3/3</text><text x="74.8" y="459" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">✓</text><text x="91.6" y="459" textLength="243.6" lengthAdjust="spacingAndGlyphs" fill="#656967">Find where the cap is ignored</text><text x="74.8" y="477" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">✓</text><text x="91.6" y="477" textLength="336.0" lengthAdjust="spacingAndGlyphs" fill="#656967">Cap the discount in totals() and test it</text><text x="74.8" y="495" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">✓</text><text x="91.6" y="495" textLength="252.0" lengthAdjust="spacingAndGlyphs" fill="#656967">Check the API's coupon preview</text><text x="32.8" y="531" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">•</text><text x="49.6" y="531" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e">totals()</text><text x="125.2" y="531" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">never read</text><text x="217.6" y="531" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#22c55e">coupon.cap</text><text x="301.6" y="531" textLength="369.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">: a $15-cap coupon took $40 off a $200 cart.</text><text x="49.6" y="567" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">•</text><text x="66.4" y="567" textLength="159.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">The discount is now</text><text x="234.4" y="567" textLength="210.0" lengthAdjust="spacingAndGlyphs" fill="#22c55e">min(subtotal × rate, cap)</text><text x="444.4" y="567" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff">.</text><text x="49.6" y="585" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">•</text><text x="66.4" y="585" textLength="403.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff">The graph lists two callers; a sub-agent checked</text><text x="478.0" y="585" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#22c55e">preview()</text><text x="553.6" y="585" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff">.</text><text x="49.6" y="603" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">•</text><text x="66.4" y="603" textLength="235.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff">The new test covers the cap:</text><text x="310.0" y="603" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">3 passed</text><text x="377.2" y="603" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff">.</text><text x="32.8" y="639" textLength="1310.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="32.8" y="657" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">❭</text><text x="32.8" y="675" textLength="1310.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="41.2" y="693" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#22c55e" font-weight="700">Build</text><text x="91.6" y="693" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">·</text><text x="108.4" y="693" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">GPT-6-Luna</text><text x="200.8" y="693" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">· native</text><text x="1276.0" y="693" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">↻ 1 loop</text></g>
