<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" style="white-space:pre"><text x="32.8" y="63" textLength="252.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">fix/coupon-cap ~/Code/shop-api</text><text x="301.6" y="63" textLength="277.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Cap coupon discounts at the coupo</text><text x="629.2" y="63" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e">+33</text><text x="662.8" y="63" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#ef4444">-2</text><text x="688.0" y="63" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">|</text><text x="780.4" y="63" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">46%</text><text x="32.8" y="81" textLength="764.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">› Orders with a capped coupon get the full percentage off. Find why, fix it and add a test.</text><text x="58.0" y="117" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#187d3e">✎</text><text x="74.8" y="117" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Edit</text><text x="116.8" y="117" textLength="151.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">src/cart/totals.ts</text><text x="284.8" y="117" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#22c55e">+2</text><text x="310.0" y="117" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#ef4444">−1</text><text x="58.0" y="135" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="135" textLength="520.8" lengthAdjust="spacingAndGlyphs" fill="#25789a">@@ -18,5 +18,6 @@ export function totals(cart: Cart): Totals {</text><text x="58.0" y="153" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="153" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">18 18</text><text x="158.8" y="153" textLength="394.8" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const subtotal = sum(cart.items.map(lineTotal))</text><text x="58.0" y="171" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="171" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">19</text><text x="125.2" y="171" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ef4444">-</text><text x="158.8" y="171" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const</text><text x="209.2" y="171" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#ef4444" font-weight="700">discount</text><text x="284.8" y="171" textLength="243.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">= subtotal * cart.coupon.rate</text><text x="58.0" y="189" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="100.0" y="189" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">19</text><text x="125.2" y="189" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">+</text><text x="158.8" y="189" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const</text><text x="209.2" y="189" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e" font-weight="700">raw</text><text x="242.8" y="189" textLength="243.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">= subtotal * cart.coupon.rate</text><text x="58.0" y="207" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="100.0" y="207" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">20</text><text x="125.2" y="207" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">+</text><text x="158.8" y="207" textLength="453.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const discount = Math.min(raw, cart.coupon.cap ?? raw)</text><text x="58.0" y="225" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="225" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">20 21</text><text x="158.8" y="225" textLength="378.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">const total = roundCents(subtotal - discount)</text><text x="58.0" y="243" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="243" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">21 22</text><text x="158.8" y="243" textLength="302.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff">return { subtotal, discount, total }</text><text x="58.0" y="261" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#636363">│</text><text x="74.8" y="261" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">22 23</text><text x="142.0" y="261" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff">}</text><text x="32.8" y="297" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">┃ #</text><text x="66.4" y="297" textLength="151.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">Allow Run command?</text><text x="32.8" y="315" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">┃</text><text x="58.0" y="315" textLength="235.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff">bun test test/totals.test.ts</text><text x="32.8" y="333" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">┃</text><text x="32.8" y="351" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">┃ 1</text><text x="74.8" y="351" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e">(●)</text><text x="108.4" y="351" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">Allow once</text><text x="209.2" y="351" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#656967">a</text><text x="32.8" y="369" textLength="260.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">┃ 2  (○) Allow for this session</text><text x="310.0" y="369" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#656967">s</text><text x="32.8" y="387" textLength="126.0" lengthAdjust="spacingAndGlyphs" fi