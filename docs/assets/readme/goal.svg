<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" style="white-space:pre"><text x="32.8" y="63" textLength="252.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">fix/coupon-cap ~/Code/shop-api</text><text x="301.6" y="63" textLength="277.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Cap coupon discounts at the coupo</text><text x="629.2" y="63" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e">+33</text><text x="662.8" y="63" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#ef4444">-2</text><text x="688.0" y="63" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">|</text><text x="780.4" y="63" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">46%</text><text x="32.8" y="81" textLength="764.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">› Orders with a capped coupon get the full percentage off. Find why, fix it and add a test.</text><text x="58.0" y="117" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#187d3e">$</text><text x="74.8" y="117" textLength="235.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e" font-weight="700">bun test test/totals.test.ts</text><text x="326.8" y="117" textLength="126.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">3 pass · 0 fail</text><text x="58.0" y="153" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">✓</text><text x="74.8" y="153" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">Todos</text><text x="125.2" y="153" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">2/3</text><text x="74.8" y="171" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">✓</text><text x="91.6" y="171" textLength="243.6" lengthAdjust="spacingAndGlyphs" fill="#656967">Find where the cap is ignored</text><text x="74.8" y="189" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">✓</text><text x="91.6" y="189" textLength="336.0" lengthAdjust="spacingAndGlyphs" fill="#656967">Cap the discount in totals() and test it</text><text x="74.8" y="207" textLength="268.8" lengthAdjust="spacingAndGlyphs" fill="#ffffff">□ Check the API's coupon preview</text><text x="32.8" y="243" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">•</text><text x="49.6" y="243" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#22c55e">totals()</text><text x="125.2" y="243" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">never read</text><text x="217.6" y="243" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#22c55e">coupon.cap</text><text x="301.6" y="243" textLength="369.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">: a $15-cap coupon took $40 off a $200 cart.</text><text x="49.6" y="279" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">•</text><text x="66.4" y="279" textLength="159.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff">The discount is now</text><text x="234.4" y="279" textLength="210.0" lengthAdjust="spacingAndGlyphs" fill="#22c55e">min(subtotal × rate, cap)</text><text x="444.4" y="279" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff">.</text><text x="49.6" y="297" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">•</text><text x="66.4" y="297" textLength="235.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff">The new test covers the cap:</text><text x="310.0" y="297" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">3 passed</text><text x="377.2" y="297" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#ffffff">.</text><text x="58.0" y="333" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#187d3e">▤</text><text x="74.8" y="333" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">Read</text><text x="116.8" y="333" textLength="151.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">src/api/coupons.ts</text><text x="284.8" y="333" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">30 lines</text><text x="58.0" y="369" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">⠋</text><text x="74.8" y="369" textLength="142.8" lengthAdjust="spacingAndGlyphs" fill="#22c55e" font-weight="700">bun test test/api</text><text x="234.4" y="369" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">5m 48s</text><text x="58.0" y="387" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">│</text><text x="74.8" y="387" textLength="134.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">bun test v1.3.13</text><text x="58.0" y="405" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">│</text><text x="74.8" y="405" textLength="210.0" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">test/api/coupons.test.ts:</text><text x="41.2" y="441" textLength="235.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff">⠋ Running command...  5m 49s</text><text x="32.8" y="459" textLength="772.8" lengthAdjust="spacingAndGlyphs" fill="#22c55e">────────────────────────────────────────────────────────────────────────────────────────────</text><text x="32.8" y="477" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">❭</text><text x="32.8" y="495" textLength="772.8" lengthAdjust="spacingAndGlyphs" fill="#22c55e">────────────────────────────────────────────────────────────────────────────────────────────</text><text x="41.2" y="513" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#22c55e" font-weight="700">Build</text><text x="91.6" y="513" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">·</text><text x="108.4" y="513" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">GPT-6-Luna</text><text x="200.8" y="513" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#a3a3a3">· native</text><text x="553.6" y="513" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#22c55e">◎ goal</text><text x="612.4" y="513" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#ffffff">64k/200k</t