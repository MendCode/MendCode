name: windows-smoke

# The Windows x64 binary on a Windows runner: its daemon starts and answers, a session command works, and `mendcode upgrade`
# replaces the running executable. On demand (`gh workflow run windows-smoke.yml --ref <branch>`) and for pull requests that touch
# what a Windows binary depends on. A push to main does not run it: the release gate builds and smokes the same binary per tag.
on:
  pull_request:
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "scripts/windows-smoke.sh"
      - "packages/upgrade/**"
      - "packages/daemon/**"
      - "packages/client/**"
      - "apps/cli/src/launcher.ts"
      - "apps/cli/src/solo.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.5
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile --config.minimumReleaseAge=10080
      - name: Build the Windows binary
        run: bun run build --target windows-x64 --outfile dist/mendcode.exe
      - name: Upgrade and swap tests on Windows
        run: bun test packages/upgrade/test/windows.test.ts packages/upgrade/test/windows-running.test.ts packages/store/test/writer-lock.test.ts
      - name: Daemon, session and upgrade smoke
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_UPGRADE_TO: v0.0.19
        run: bash scripts/windows-smoke.sh "$PWD/dist/mendcode.exe" "$RUNNER_TEMP/smoke"
      - name: Published Windows binaries, same smoke (what users have installed)
        # Informational: tells whether a failure a user sees belongs to a release already published.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v0.0.4 v0.0.19; do
            mkdir -p "$RUNNER_TEMP/released/$tag"
            gh release download "$tag" --repo MendCode/MendCode --pattern "mendcode-*-windows-x64.exe" --dir "$RUNNER_TEMP/released/$tag"
            exe=$(ls "$RUNNER_TEMP/released/$tag"/mendcode-*-windows-x64.exe)
            echo "=== $tag: $exe"
            bash scripts/windows-smoke.sh "$exe" "$RUNNER_TEMP/smoke-$tag" || echo "released $tag smoke FAILED"
          done
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke-logs
          path: ${{ runner.temp }}/smoke*/logs
          if-no-files-found: warn
          retention-days: 7
