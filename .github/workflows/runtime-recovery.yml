name: Runtime and recovery tests

on:
  pull_request:
    paths:
      - "src/mendcode/**"
      - ".github/workflows/runtime-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Linux runtime and recovery contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.0.9
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: src/mendcode/package.json
      - name: Install frozen dependencies
        working-directory: src/mendcode
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile --ignore-scripts
      - name: Prepare deterministic test runtime
        working-directory: src/mendcode/packages/opencode
        run: |
          bun run script/fix-node-pty.ts
          MODELS_DEV_API_JSON="$PWD/test/tool/fixtures/models-api.json" bun run script/generate.ts
      - name: Typecheck
        working-directory: src/mendcode
        run: bun run --cwd packages/opencode typecheck
      - name: Release index contracts
        working-directory: src/mendcode
        run: node --test script/release-index.test.mjs
      - name: Runtime and updater regressions
        working-directory: src/mendcode/packages/opencode
        shell: bash
        run: |
          set -euo pipefail
          export MENDCODE_DB="${RUNNER_TEMP}/mendcode-contracts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db"
          bun test --timeout 30000 \
            test/installation \
            test/storage/compatibility.test.ts test/storage/writer-lease.test.ts \
            test/cli/run-attach.test.ts test/cli/upgrade-channel.test.ts test/cli/upgrade-readonly.test.ts \
            test/cli/tui/shared-server.test.ts test/cli/tui/thread.test.ts \
            test/cli/tui/widgets-runtime.test.tsx test/cli/tui/widgets-tray.test.tsx \
            test/cli/tui/agent-command-panel.test.tsx \
            test/mend/concurrent-model-policy.test.ts \
            test/session/continuity.test.ts test/session/session-notes.test.ts test/session/llm.test.ts \
            test/server/usage.test.ts test/server/release-channel.test.ts test/server/upgrade-progress.test.ts
          export MENDCODE_DB="${RUNNER_TEMP}/mendcode-executor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db"
          bun test test/session/prompt.test.ts --timeout 30000 --test-name-pattern "continuity wakes the existing executor"
