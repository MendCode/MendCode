name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, for example 1.14.39"
        required: true
        type: string
      dry_run:
        description: "Build and attest assets without publishing a GitHub Release"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Linux and Windows baseline release assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      MENDCODE_VERSION: ${{ inputs.version }}
      OPENCODE_VERSION: ${{ inputs.version }}
      BUN_INSTALL_CACHE_DIR: /tmp/mendcode-bun-cache
    steps:
      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be semver without leading v: ${VERSION}" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure release runs from main
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME:-}"
          if [ "$branch" != "main" ]; then
            echo "publishing releases is only allowed from main; current ref is ${branch}" >&2
            exit 1
          fi

      - name: Supply-chain preflight
        shell: bash
        run: bash .github/scripts/supply-chain-preflight.sh

      - name: Block vulnerable release dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" \
            ghcr.io/google/osv-scanner:v2.3.8@sha256:64e86bec6df2466feea5137fc7c78fb3b7c21ec077f014d7130f64810e50676b \
            scan --config /src/.github/osv-release.toml --lockfile /src/src/mendcode/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.0.9

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: src/mendcode/package.json

      - name: Install dependencies with frozen lockfile
        working-directory: src/mendcode
        shell: bash
        run: |
          set -euo pipefail
          pnpm --pm-on-fail=ignore install --frozen-lockfile --ignore-scripts
          bun run --cwd packages/opencode fix-node-pty

      - name: Build release assets
        working-directory: src/mendcode
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd packages/opencode script/build.ts --release-assets --skip-embed-web-ui --skip-install --exclude-os=darwin

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mendcode-release-${{ inputs.version }}-linux-windows-baseline
          path: |
            src/mendcode/packages/opencode/dist/mendcode-linux-*.tar.gz
            src/mendcode/packages/opencode/dist/mendcode-windows-x64-baseline.zip
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows ${{ matrix.arch }} release assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            build_args: --single
            expected_executables: 1
          - runner: windows-11-arm
            arch: arm64
            build_args: --single
            expected_executables: 1
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      MENDCODE_VERSION: ${{ inputs.version }}
      OPENCODE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.0.9

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: src/mendcode/package.json

      - name: Install dependencies with frozen lockfile
        working-directory: src/mendcode
        shell: pwsh
        run: |
          pnpm --pm-on-fail=ignore install --frozen-lockfile --ignore-scripts
          bun run --cwd packages/opencode fix-node-pty

      - name: Build native Windows release assets
        working-directory: src/mendcode
        shell: pwsh
        run: bun run --cwd packages/opencode script/build.ts --skip-embed-web-ui --skip-install ${{ matrix.build_args }}

      - name: Verify Windows executable metadata
        working-directory: src/mendcode
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem packages/opencode/dist/mendcode-windows-${{ matrix.arch }}*/bin/mendcode.exe)
          if ($executables.Count -ne ${{ matrix.expected_executables }}) {
            throw "expected ${{ matrix.expected_executables }} Windows ${{ matrix.arch }} executable(s), found $($executables.Count)"
          }
          foreach ($executable in $executables) {
            if ($executable.VersionInfo.ProductName -ne "MendCode") {
              throw "$($executable.FullName) retained the Bun product metadata"
            }
            if ($executable.VersionInfo.FileDescription -ne "MendCode AI coding terminal") {
              throw "$($executable.FullName) has unexpected file description: $($executable.VersionInfo.FileDescription)"
            }
          }

      - name: Package Windows release assets
        working-directory: src/mendcode
        shell: pwsh
        run: |
          Get-ChildItem packages/opencode/dist/mendcode-windows-* -Directory | ForEach-Object {
            Compress-Archive -Path "$($_.FullName)/bin/*" -DestinationPath "packages/opencode/dist/$($_.Name).zip" -Force
          }

      - name: Upload Windows release artifacts to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mendcode-release-${{ inputs.version }}-windows-${{ matrix.arch }}
          path: src/mendcode/packages/opencode/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  build-darwin:
    name: Build Darwin ${{ matrix.arch }} release asset
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      MENDCODE_VERSION: ${{ inputs.version }}
      OPENCODE_VERSION: ${{ inputs.version }}
      BUN_INSTALL_CACHE_DIR: /tmp/mendcode-bun-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.0.9

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: src/mendcode/package.json

      - name: Install dependencies with frozen lockfile
        working-directory: src/mendcode
        shell: bash
        run: |
          set -euo pipefail
          pnpm --pm-on-fail=ignore install --frozen-lockfile --ignore-scripts
          bun run --cwd packages/opencode fix-node-pty

      - name: Build native Darwin release asset
        working-directory: src/mendcode
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          case "${{ matrix.arch }}:${actual_arch}" in
            arm64:arm64|x64:x86_64) ;;
            *) echo "unexpected Darwin runner architecture: expected ${{ matrix.arch }}, got ${actual_arch}" >&2; exit 1 ;;
          esac
           if [ "${{ matrix.arch }}" = "x64" ]; then
             # The release contract includes both AVX2 and baseline Intel archives.
             bun run --cwd packages/opencode script/build.ts --single --release-assets --skip-embed-web-ui --skip-install
             mv packages/opencode/dist/mendcode-darwin-x64.zip /tmp/mendcode-darwin-x64.zip
             bun run --cwd packages/opencode script/build.ts --single --baseline --release-assets --skip-embed-web-ui --skip-install
             mv /tmp/mendcode-darwin-x64.zip packages/opencode/dist/mendcode-darwin-x64.zip
           else
             bun run --cwd packages/opencode script/build.ts --single --release-assets --skip-embed-web-ui --skip-install
           fi


      - name: Upload Darwin release asset to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mendcode-release-${{ inputs.version }}-darwin-${{ matrix.arch }}
          path: src/mendcode/packages/opencode/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  assemble-release:
    name: Assemble and attest release assets
    if: ${{ always() && needs.build-release.result == 'success' && needs.build-windows.result == 'success' && needs.build-darwin.result == 'success' }}
    needs: [build-release, build-windows, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download platform release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: mendcode-release-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Rebuild release checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) -print | sort | xargs shasum -a 256 > SHA256SUMS

      - name: Check release assets
        shell: bash
        run: bash src/mendcode/script/check-release-assets.sh dist

      - name: Write release manifest
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "version=${VERSION}"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat SHA256SUMS
          } > RELEASE-MANIFEST.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: src/mendcode
          format: spdx-json
          output-file: dist/mendcode.spdx.json
          upload-artifact: false

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE-MANIFEST.txt
            dist/mendcode.spdx.json

      - name: Upload assembled release artifacts to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mendcode-release-${{ inputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Create draft GitHub Release
    if: ${{ inputs.dry_run == false }}
    needs: assemble-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mendcode-release-${{ inputs.version }}
          path: dist

      - name: Create draft GitHub Release
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="${RUNNER_TEMP}/mendcode-release-notes.md"
          section_found=false
          {
            printf '# %s\n' "$tag"
            while IFS= read -r line; do
              if [[ "$line" == "## ${VERSION} - "* ]]; then
                section_found=true
                continue
              fi
              if [[ "$section_found" == true && "$line" == "## "* ]]; then
                break
              fi
              if [[ "$section_found" == true ]]; then
                printf '%s\n' "$line"
              fi
            done < "${GITHUB_WORKSPACE}/CHANGELOG.md"
          } > "$notes"
          if [[ "$section_found" != true ]]; then
            echo "Missing CHANGELOG.md section for ${VERSION}" >&2
            exit 1
          fi
          cat >> "$notes" <<EOF

          ## Verify

          Built from \`${GITHUB_SHA}\`.

          \`\`\`bash
          gh release download ${tag} --repo ${GITHUB_REPOSITORY}
          shasum -a 256 -c SHA256SUMS
          for file in mendcode-*.zip mendcode-*.tar.gz SHA256SUMS RELEASE-MANIFEST.txt mendcode.spdx.json; do
            gh attestation verify --repo ${GITHUB_REPOSITORY} "$file"
          done
          \`\`\`
          EOF
          gh release create "$tag" \
            *.zip \
            *.tar.gz \
            SHA256SUMS \
            RELEASE-MANIFEST.txt \
            mendcode.spdx.json \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "$tag" \
            --notes-file "$notes" \
            --draft \
            ${{ inputs.prerelease && '--prerelease' || '' }}
