name: Stable startup regression
on:
  pull_request:
    paths: ["src/mendcode/**", ".github/workflows/stable-startup.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.0.9
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: src/mendcode/package.json
      - name: Prepare frozen dependencies and test catalog
        working-directory: src/mendcode
        run: |
          pnpm --pm-on-fail=ignore install --frozen-lockfile --ignore-scripts
          cd packages/opencode
          bun run script/fix-node-pty.ts
          MODELS_DEV_API_JSON="$PWD/test/tool/fixtures/models-api.json" bun run script/generate.ts
      - name: Typecheck and isolated startup regressions
        working-directory: src/mendcode/packages/opencode
        run: |
          bun run typecheck
          for test_file in test/installation/backend-startup.test.ts test/installation/recorded-schema.test.ts test/cli/tui/thread.test.ts test/plugin/auth-override.test.ts; do
            bash -c 'export MENDCODE_DB="${TMPDIR:-/tmp}/opencode-test-data-$$/share/contracts.db"; exec bun test --timeout 30000 "$@"' bash "$test_file"
          done
