name: Windows installer contracts

on:
  pull_request:
    paths:
      - "src/mendcode/install.ps1"
      - "src/mendcode/script/windows-installer-smoke.ts"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: src/mendcode/package.json
      - name: Verify published executable fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $fixture = Join-Path $env:RUNNER_TEMP "mendcode-fixture"
          gh release download v0.1.43 --repo MendCode/MendCode --pattern mendcode-windows-x64.zip --pattern SHA256SUMS --dir $fixture
          if ($LASTEXITCODE -ne 0) { throw "Fixture download failed" }
          $archive = Join-Path $fixture "mendcode-windows-x64.zip"
          gh attestation verify $archive --repo MendCode/MendCode --signer-workflow MendCode/MendCode/.github/workflows/release.yml --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { throw "Fixture provenance failed" }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $fixture "bin")
          "MENDCODE_INSTALLER_TEST_BINARY=$(Join-Path $fixture 'bin/mendcode.exe')" >> $env:GITHUB_ENV
          "MENDCODE_VERSION=0.1.43" >> $env:GITHUB_ENV
      - name: Exercise current installer with verified fixture
        working-directory: src/mendcode
        shell: pwsh
        run: |
          bun run script/windows-installer-smoke.ts
          if ($LASTEXITCODE -ne 0) { throw "Windows installer contract failed" }
