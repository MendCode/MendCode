# Sections of the notes `gh release create --generate-notes` writes for a release.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Features
      labels: ["enhancement", "feature"]
    - title: Fixes
      labels: ["bug", "fix"]
    - title: Documentation
      labels: ["documentation"]
    - title: Other changes
      labels: ["*"]
