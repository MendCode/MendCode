name: checks
description: Typecheck and run the whole test suite, in parts, on Linux. Shared by ci.yml and by the release gate in release.yml so both run the same thing.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22.16.0
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      with:
        bun-version: 1.3.13
    - name: Install locked dependencies
      # No dependency cache on purpose: this takes about 3 s on a cold runner, and a cache restore/save pair costs about as much while
      # adding a writable shared store to a release gate. The frozen lockfile and the 7-day minimum release age stay as they were.
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@11.17.0 --activate
        pnpm install --frozen-lockfile --config.minimumReleaseAge=10080
    - name: System tools the tests need
      # ripgrep: the file REST API (/find) is ripgrep-backed. zsh: the zsh completion script is syntax-checked with `zsh -n`.
      # bubblewrap: the Linux profile of the workflow script host. Ubuntu 24.04 restricts unprivileged user namespaces by default.
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends bubblewrap ripgrep zsh
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        for tool in git bwrap rg zsh bash sh; do printf '%-6s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"; done
        rg --version | head -n 1
        git --version
        printf 'cpus %s, memory MB %s\n' "$(nproc)" "$(free -m | awk '/^Mem:/ { print $2 }')"
    - name: Typecheck
      shell: bash
      run: bun run typecheck
    - name: Test in parts
      # scripts/test-shards.sh: one bun process per part, so memory is released between parts (a single `bun test` reached 6 GB and was
      # cancelled by the job timeout). A failing, timed-out or crashed part fails the step after the other parts have run.
      shell: bash
      env:
        # Time budgets in tests are developer-machine numbers; this multiplies them (scripts/test-budget.ts) and bun's 5 s default
        # per-test timeout. Memory, size and count assertions are not scaled. Never set outside CI.
        MENDCODE_TEST_TIME_SCALE: "3"
        # These cases fail, instead of skipping, when the tool is missing (scripts/test-budget.ts toolGate).
        MENDCODE_REQUIRE_TOOLS: rg,zsh
        # A part that hangs is killed after 25 minutes and reported with the tail of its output.
        MENDCODE_TEST_PART_SECONDS: "1500"
        MENDCODE_TEST_LOG_DIR: ${{ runner.temp }}/test-logs
        # One line every 20 s with the part, the test file it is in, load and free memory: a run that is cancelled or killed (the second
        # release run ended 146 s into the daemon part, nothing printed why) ends its log with what it was doing and whether memory ran out.
        MENDCODE_TEST_HEARTBEAT_SECONDS: "20"
        # Every part runs in a session of its own, so a signal aimed at a group or session from inside the tests cannot reach this
        # script or the runner's step; the script reports the signal instead.
        MENDCODE_TEST_NEW_SESSION: "1"
        # Tests that commit need an identity; a developer machine has one in its global git config.
        GIT_AUTHOR_NAME: ci
        GIT_AUTHOR_EMAIL: ci@example.invalid
        GIT_COMMITTER_NAME: ci
        GIT_COMMITTER_EMAIL: ci@example.invalid
      run: sh scripts/test-shards.sh
    - name: What the machine says about how the tests ended
      # Also after a cancelled job: memory and the kernel's out-of-memory lines are what tell a killed host from a failing test.
      if: always()
      shell: bash
      run: |
        free -m
        sudo dmesg 2>/dev/null | grep -i -E 'out of memory|oom-kill|killed process|oom_reaper' | tail -n 20 | sed 's/^/kernel: /' || echo "the kernel log has no line about memory (or cannot be read)"
    - name: Keep the full output of every part
      # always(): a cancelled job (what a runner shutdown or an out-of-memory host looks like) has failure() false, and its logs are
      # exactly the ones needed. The script copies a part's log here when it receives a signal too.
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-logs
        path: ${{ runner.temp }}/test-logs
        if-no-files-found: ignore
        retention-days: 7
